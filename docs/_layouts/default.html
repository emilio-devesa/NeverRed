<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ page.description | default: site.description }}">
  <link rel="icon" type="image/svg+xml" href="{{ '/assets/favicon.svg' | relative_url }}">
  <link rel="stylesheet" href="{{ '/assets/site.css' | relative_url }}">
  <meta name="theme-color" content="#0b1020">
  <script>
    (function () {
      try {
        var t = localStorage.getItem("theme");
        if (t === "light" || t === "dark") {
          document.documentElement.setAttribute("data-theme", t);
        } else if (window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches) {
          document.documentElement.setAttribute("data-theme", "light");
        }
      } catch (e) {}
    })();
  </script>
</head>
<body>
  <header class="site-header" id="site-header">
    <div class="header-inner wrap">
      <a class="brand" href="{{ '/' | relative_url }}">
        <img class="brand-mark" src="{{ '/assets/favicon.svg' | relative_url }}" alt="NeverRed" width="40" height="40">
        <span class="brand-text"><strong>NeverRed</strong></span>
      </a>
      <button class="nav-toggle" type="button" aria-label="Menú" aria-expanded="false" aria-controls="site-nav">
        <span class="nav-toggle-bars" aria-hidden="true"></span>
      </button>
      <nav class="site-nav" id="site-nav" aria-label="Principal">
        {% for p in site.header_pages %}
          {% assign target = site.pages | where: "path", p | first %}
          {% if target %}
            <a href="{{ target.url | relative_url }}"{% if page.url == target.url %} aria-current="page"{% endif %}>{{ target.title | default: target.name }}</a>
          {% endif %}
        {% endfor %}
        <a class="nav-github" href="https://github.com/emilio-devesa/NeverRed" target="_blank" rel="noopener">GitHub</a>
        <button class="theme-toggle" type="button" id="theme-toggle" aria-label="Switch to light theme" title="Switch to light theme">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3a9 9 0 1 0 9 9 7 7 0 0 1-9-9z"/></svg>
        </button>
      </nav>
    </div>
  </header>

  <main id="content">
    {{ content }}
  </main>

  <footer class="site-footer">
    <div class="wrap footer-inner">
      <p>NeverRed · contabilidad personal por partida doble.</p>
      <nav aria-label="Pie">
        <a href="https://github.com/emilio-devesa/NeverRed">GitHub</a>
        <a href="{{ '/guia/' | relative_url }}">Guía</a>
        <a href="{{ '/api/' | relative_url }}">API</a>
      </nav>
    </div>
  </footer>

  <script src="{{ '/assets/site.js' | relative_url }}" defer></script>
</body>
</html>
