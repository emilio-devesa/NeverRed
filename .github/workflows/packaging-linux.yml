# Al publicar un tag v*: construye el AppImage x86_64 de Linux y lo
# adjunta a la Release. Sin dependencias extra en el resultado.
name: Linux AppImage

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  appimage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - run: sudo apt-get update && sudo apt-get install -y librsvg2-bin
      - run: ./packaging/linux/build.sh "${GITHUB_REF_NAME#v}"
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ github.ref_name }}
          files: dist/*.AppImage
