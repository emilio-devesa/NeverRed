# Al publicar un tag v* (p. ej. v1.0.0): construye la imagen Docker,
# la sube a GHCR y crea la Release en GitHub con notas automáticas.
name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write   # crear la Release
  packages: write   # subir la imagen a GHCR

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # GHCR exige el nombre en minúsculas (el repo es NeverRed)
      - name: Nombre de imagen en minúsculas
        run: echo "IMAGE=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        id: meta
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - name: Humo del backend (registro + login + datos)
        run: |
          python3 backend/tests/test_server.py 2>&1 | tail -3

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"

      - name: Tests del frontal (lógica contable)
        run: node --test frontend/tests/

      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Notas de la versión (CHANGELOG → body de la release)
        env:
          TAG: ${{ github.ref_name }}
          IMAGE: ${{ env.IMAGE }}
        run: |
          python3 - "$TAG" "$IMAGE" <<'PYEOF' > /tmp/release-body.md
          import re
          import sys
          tag, image = sys.argv[1], sys.argv[2]
          text = open('CHANGELOG.md', encoding='utf-8').read()
          m = re.search(r'^## ' + re.escape(tag) + r'[ \t—-]*([^\n]*)\n(.*?)(?=^## |\Z)',
                        text, re.S | re.M)
          if m and m.group(2).strip():
              title = m.group(1).strip()
              head = '## Novedades en %s%s' % (tag, ' — ' + title if title else '')
              notes = head + '\n' + m.group(2).strip()
          else:
              notes = '## Novedades en %s\nMejoras internas y correcciones.' % tag
          dl = ('Historial completo: '
                '[CHANGELOG.md](https://github.com/emilio-devesa/NeverRed/blob/main/CHANGELOG.md)'
                '\n\n## Descargar 📥\n'
                '- **macOS (sin instalar nada)**: baja el `.dmg` en *Assets*\n'
                '  (vale para Intel y Apple Silicon), arrástralo a Aplicaciones\n'
                '  y haz doble clic.\n'
                '- **Linux (sin instalar nada)**: baja el `.AppImage`, dale\n'
                '  permiso de ejecución y haz doble clic.\n'
                '- **Docker** 🐳:\n'
                '```bash\ndocker run -d --name neverred -p 8000:8000 \\\n'
                '  -v neverred-data:/data --restart unless-stopped \\\n'
                '  %s:%s\n```\n'
                'Abrir **http://servidor:8000** y registrarse. La BD persiste en el volumen.\n'
                'Demo: `python3 backend/seed_demo.py` → demo@neverred.local / DemoNeverRed2026.'
                % (image, tag))
          print(notes + '\n\n' + dl)
          PYEOF
          head -8 /tmp/release-body.md

      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          body_path: /tmp/release-body.md
