# Al publicar un tag v* (p. ej. v1.0.0): construye la imagen Docker,
# la sube a GHCR y crea la Release en GitHub con notas automáticas.
name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write   # crear la Release
  packages: write   # subir la imagen a GHCR

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # GHCR exige el nombre en minúsculas (el repo es NeverRed)
      - name: Nombre de imagen en minúsculas
        run: echo "IMAGE=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        id: meta
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - name: Humo del backend (registro + login + datos)
        run: |
          python3 backend/tests/test_server.py 2>&1 | tail -3

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"

      - name: Tests del frontal (lógica contable)
        run: node --test frontend/tests/

      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          generate_release_notes: true
          body: |
            ## Descargar 📥
            - **macOS (sin instalar nada)**: baja el `.dmg` en *Assets*
              (vale para Intel y Apple Silicon), arrástralo a Aplicaciones
              y haz doble clic.
            - **Linux (sin instalar nada)**: baja el `.AppImage`, dale
              permiso de ejecución y haz doble clic.
            - **Docker** 🐳:
            ```bash
            docker run -d --name neverred -p 8000:8000 \
              -v neverred-data:/data --restart unless-stopped \
              ${{ env.IMAGE }}:${{ github.ref_name }}
            ```
            Abrir **http://servidor:8000** y registrarse. La BD persiste en el volumen.
            Demo: `python3 backend/seed_demo.py` → demo@neverred.local / DemoNeverRed2026.
