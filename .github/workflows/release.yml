# Al publicar un tag v* (p. ej. v1.0.0): construye la imagen Docker,
# la sube a GHCR y crea la Release en GitHub con notas automáticas.
name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write   # crear la Release
  packages: write   # subir la imagen a GHCR

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # GHCR exige el nombre en minúsculas (el repo es NeverRed)
      - name: Nombre de imagen en minúsculas
        run: echo "IMAGE=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - name: Humo del backend (registro + login + datos)
        run: |
          python3 backend/server.py --port 8123 &
          SRV=$!
          sleep 2
          curl -fsS http://127.0.0.1:8123/api/health
          TOK=$(curl -fsS -X POST http://127.0.0.1:8123/api/register \
            -H 'Content-Type: application/json' \
            -d '{"name":"CI","email":"ci@test.local","password":"secreta123"}' \
            | python3 -c "import json,sys; print(json.load(sys.stdin)['token'])")
          curl -fsS -X PUT http://127.0.0.1:8123/api/data \
            -H 'Content-Type: application/json' -H "Authorization: Bearer $TOK" \
            -d '{"accounts":[],"entries":[],"seq":1,"currency":"EUR"}'
          kill $SRV

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          body: |
            ## Desplegar con Docker 🐳
            ```bash
            docker run -d --name neverred -p 8000:8000 \
              -v neverred-data:/data --restart unless-stopped \
              ${{ env.IMAGE }}:${{ github.ref_name }}
            ```
            Abrir **http://servidor:8000** y registrarse. La BD persiste en el volumen.
            Demo: `python3 backend/seed_demo.py` → demo@neverred.local / DemoNeverRed2026.
