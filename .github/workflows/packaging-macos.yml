# Al publicar un tag v*: construye el .dmg universal de macOS (vale para
# Intel y Apple Silicon: solo lleva scripts + Python del sistema) y lo
# adjunta a la Release. Sin dependencias extra: herramientas de serie.
name: macOS DMG

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  dmg:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (Node 24)
        with:
          fetch-depth: 0
      - run: ./packaging/macos/build.sh "${GITHUB_REF_NAME#v}"
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ github.ref_name }}
          files: dist/*.dmg
