# Al publicar un tag v*: construye el .dmg de macOS (Intel y Apple Silicon)
# y lo adjunta a la Release. Sin dependencias extra: solo herramientas de serie.
name: macOS DMG

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  dmg:
    strategy:
      matrix:
        include:
          - runner: macos-14
            suffix: -arm64
          - runner: macos-13
            suffix: -intel
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: ./packaging/macos/build.sh "${GITHUB_REF_NAME#v}" "${{ matrix.suffix }}"
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: dist/*.dmg
