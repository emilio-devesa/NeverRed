# CI: tests del backend (Python stdlib) y del frontal (node --test, sin dependencias).
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (Node 24)
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0 (Node 24)
        with:
          python-version: "3.12"
      - run: python3 backend/tests/test_server.py
      - run: python3 backend/tests/test_market.py
      - run: python3 backend/tests/test_telemetry_forward.py
      - run: python3 backend/tests/test_telemetry_pairing.py
      - run: python3 backend/tests/test_integration.py

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (Node 24)
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
      # Glob explícito: `node --test frontend/tests/` falla en Node ≥ 22.
      - run: node --test frontend/tests/*.test.js
