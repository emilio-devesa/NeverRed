# Al publicar un tag v*: construye el paquete de Windows (NeverRed.exe +
# NeverRed-Update.exe vía PyInstaller y el ZIP portable) y lo adjunta a la
# Release. Ejecuta en un runner windows-latest.
name: Windows

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Inno Setup 6 (instalador)
        run: choco install innosetup -y --no-progress
      - name: PyInstaller
        run: python -m pip install --quiet pyinstaller
      - name: Humo del backend
        run: python backend/tests/test_server.py
      - name: Selftest del paquete
        run: python packaging/windows/selftest.py
      - name: Build (exe + portable + instalador)
        shell: powershell
        run: ./packaging/windows/build.ps1
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ github.ref_name }}
          files: |
            dist/windows/*.zip
            dist/windows/*.exe
