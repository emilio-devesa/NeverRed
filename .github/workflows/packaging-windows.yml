# Al publicar un tag v*: construye el paquete de Windows (NeverRed.exe +
# NeverRed-Update.exe vía PyInstaller y el ZIP portable) y lo adjunta a la
# Release. Ejecuta en un runner windows-latest.
name: Windows

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (Node 24)
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0 (Node 24)
        with:
          python-version: "3.12"
      - name: Inno Setup 6 (instalador)
        run: choco install innosetup -y --no-progress
      - name: PyInstaller
        run: python -m pip install --quiet pyinstaller
      - name: Humo del backend
        run: python backend/tests/test_server.py
      - name: Selftest del paquete
        shell: pwsh
        # -v con salida completa al summary del job: si algo falla en el
        # runner (diferente de la VM y del Mac), queda a la vista sin login.
        run: |
          python -X utf8 -u packaging/windows/selftest.py -v *> selftest-out.txt
          $code = $LASTEXITCODE
          Get-Content selftest-out.txt -Encoding utf8 |
            Out-File $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          exit $code
      - name: Build (exe + portable + instalador)
        shell: powershell
        run: ./packaging/windows/build.ps1
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ github.ref_name }}
          files: |
            dist/windows/*.zip
            dist/windows/*.exe
